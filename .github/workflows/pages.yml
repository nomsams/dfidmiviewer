name: Verify and deploy GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Assemble the site (Grout Report Viewer at the root, DFI Viewer under /dfi-viewer/)
        run: |
          (cd grout-viewer && npm test)
          mkdir -p site/dfi-viewer
          cp -r dist/. site/dfi-viewer/
          cp -r grout-viewer/index.html grout-viewer/css grout-viewer/js site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Verify Pages publishing source
        run: node scripts/verify-pages.mjs source
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        id: deployment
      - name: Verify published entry point and assets
        run: node scripts/verify-pages.mjs site '${{ steps.deployment.outputs.page_url }}dfi-viewer/'
      - name: Verify the Grout Report Viewer is the main page
        run: |
          curl -fsSL "${{ steps.deployment.outputs.page_url }}" | grep -q 'Grout Report Viewer'
          curl -fsSL -o /dev/null "${{ steps.deployment.outputs.page_url }}js/original.js"
          curl -fsSL -o /dev/null "${{ steps.deployment.outputs.page_url }}js/vendor/jspdf.umd.min.js"
